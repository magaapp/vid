<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جاري التحويل...</title>
</head>
<body>

    <h2>جاري تحويلك وإعداد الإشعارات...</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

        // إعدادات مشروعك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCH83QJQLQgxFidFwRRJmPepVh3DhmHfg8",
            authDomain: "megafrp-41498.firebaseapp.com",
            projectId: "megafrp-41498",
            storageBucket: "megafrp-41498.firebasestorage.app",
            messagingSenderId: "894020727561",
            appId: "1:894020727561:web:b81dd580e872a64e7019d8"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        async function subscribeUser() {
            try {
                // طلب إذن الإشعارات من المتصفح
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    console.log('تم منح الإذن للإشعارات.');

                    // استبدل النص التالي بمفتاح VAPID الحقيقي من لوحة تحكم Firebase
                    const currentToken = await getToken(messaging, { 
                        vapidKey: 'BJb3XGZdu2yqSuRrcNiRKqnzKK76OMmk450nrG0WmA4gCLfunnK6ZhZxmmUzzonlSNKb0FxWPDGV47_LVr04idE' 
                    });

                    if (currentToken) {
                        console.log('Token:', currentToken);

                        // 🚀 إرسال الـ Token مباشرة إلى رابط جوجل سكربت الخاص بك
                        // استخدام { mode: 'no-cors' } مهم جداً هنا لكي يتقبل جوجل سكربت الطلب من موقعك
                        await fetch('https://script.google.com/macros/s/AKfycbx30YOMcecYdHz24AVlrqEwkI82wuPOKVFokYRT0LHGG0v6JYvWxqO-n_DOKjWbh9opZA/exec', {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: currentToken })
                        });
                        
                        console.log('تم إرسال الـ Token وحفظه في جوجل شيت بنجاح.');
                    } else {
                        console.log('لم يتم العثور على Token للإشعارات.');
                    }
                } else {
                    console.log('تم رفض الإذن للإشعارات من قبل المستخدم.');
                }
            } catch (err) {
                console.error('حدث خطأ أثناء محاولة الاشتراك:', err);
            } finally {
                // تحويل المستخدم للصفحة المقصودة بعد الانتهاء
                window.location.href = "https://megafrp-41498.firebaseapp.com";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            subscribeUser();
        });
    </script>

</body>
</html>
