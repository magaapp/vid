<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعداد الإشعارات3</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 100px;">

    <h2 id="status-text">جاري تفعيل الإشعارات...</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCH83QJQLQgxFidFwRRJmPepVh3DhmHfg8",
            authDomain: "megafrp-41498.firebaseapp.com",
            projectId: "megafrp-41498",
            storageBucket: "megafrp-41498.firebasestorage.app",
            messagingSenderId: "894020727561",
            appId: "1:894020727561:web:b81dd580e872a64e7019d8"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        // تسجيل Service Worker من مسار مجلد /vid/ مع تحديد النطاق (scope) الصحيح
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/vid/firebase-messaging-sw.js', { scope: '/vid/' })
                .then((registration) => {
                    console.log('✅ تم تسجيل Service Worker بنجاح:', registration.scope);
                })
                .catch((err) => {
                    console.error('❌ فشل تسجيل Service Worker:', err);
                });
        }

        async function subscribeUser() {
            const statusText = document.getElementById('status-text');
            try {
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    statusText.innerText = "جاري جلب الـ Token...";

                    const currentToken = await getToken(messaging, { 
                        vapidKey: 'BJb3XGZdu2yqSuRrcNiRKqnzKK76OMmk450nrG0WmA4gCLfunnK6ZhZxmmUzzonlSNKb0FxWPDGV47_LVr04idE' 
                    });

                    if (currentToken) {
                        statusText.innerText = "جاري الحفظ في السيرفر...";

                        await fetch('https://script.google.com/macros/s/AKfycbx30YOMcecYdHz24AVlrqEwkI82wuPOKVFokYRT0LHGG0v6JYvWxqO-n_DOKjWbh9opZA/exec', {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: currentToken })
                        });
                        
                        statusText.innerText = "🎉 تم تفعيل الإشعارات وحفظ اشتراكك بنجاح!";
                    } else {
                        statusText.innerText = "⚠️ لم يتم العثور على Token للإشعارات.";
                    }
                } else {
                    statusText.innerText = "❌ تم رفض إذن الإشعارات من المتصفح.";
                }
            } catch (err) {
                statusText.innerText = "❌ خطأ تفصيلي: " + err.message;
                console.error("تفاصيل الخطأ الكاملة:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            subscribeUser();
        });
    </script>

</body>
</html>
