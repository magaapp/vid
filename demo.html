<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل والإعداد...</title>
</head>
<body>

    <h2 style="font-family: sans-serif; text-align: center; margin-top: 50px;">جاري تحويلك وإعداد الإشعارات...</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

        // 1. إعدادات مشروع Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCH83QJQLQgxFidFwRRJmPepVh3DhmHfg8",
            authDomain: "megafrp-41498.firebaseapp.com",
            projectId: "megafrp-41498",
            storageBucket: "megafrp-41498.firebasestorage.app",
            messagingSenderId: "894020727561",
            appId: "1:894020727561:web:b81dd580e872a64e7019d8"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        // 2. تسجيل Service Worker من المجلد الرئيسي لموقع GitHub Pages
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
                .then((registration) => {
                    console.log('✅ تم تسجيل Service Worker بنجاح:', registration.scope);
                })
                .catch((err) => {
                    console.error('❌ فشل تسجيل Service Worker:', err);
                });
        }

        // 3. دالة طلب الإذن وجلب الـ Token وحفظه
        async function subscribeUser() {
            try {
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    console.log('تم منح الإذن للإشعارات.');

                    // جلب الـ Token بمفتاح VAPID الحقيقي
                    const currentToken = await getToken(messaging, { 
                        vapidKey: 'BJb3XGZdu2yqSuRrcNiRKqnzKK76OMmk450nrG0WmA4gCLfunnK6ZhZxmmUzzonlSNKb0FxWPDGV47_LVr04idE' 
                    });

                    if (currentToken) {
                        console.log('Token:', currentToken);

                        // 🚀 إرسال الـ Token مباشرة إلى رابط Google Apps Script الخاص بك
                        await fetch('https://script.google.com/macros/s/AKfycbx30YOMcecYdHz24AVlrqEwkI82wuPOKVFokYRT0LHGG0v6JYvWxqO-n_DOKjWbh9opZA/exec', {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: currentToken })
                        });
                        
                        console.log('تم إرسال الـ Token وحفظه في جوجل شيت بنجاح.');
                    } else {
                        console.log('لم يتم العثور على Token للإشعارات.');
                    }
                } else {
                    console.log('تم رفض الإذن للإشعارات من قبل المستخدم.');
                }
            } catch (err) {
                console.error('حدث خطأ أثناء محاولة الاشتراك:', err);
            } finally {
                // مهلة ثانية واحدة لضمان وصول الطلب لجوجل سكربت قبل التحويل
                setTimeout(() => {
                    window.location.href = "https://megafrp-41498.firebaseapp.com";
                }, 1000);
            }
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            subscribeUser();
        });
    </script>

</body>
</html>
